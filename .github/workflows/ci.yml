name: product-validation
on:
  push:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Install attested pinned cccc
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/install-cccc.sh "$RUNNER_TEMP/cccc"
      - run: npm run typecheck
      - name: All tests including actual pinned measurer
        env:
          NYORORI_REAL_CCCC: ${{ runner.temp }}/cccc/cccc
        run: npm test

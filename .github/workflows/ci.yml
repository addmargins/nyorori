# CI for the nyorori gate itself.
# The cccc measurer is built from source at the pinned release commit and its
# sha256 is printed so it can be compared with policy.measurer.cccc_sha256.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CCCC_TAG: v1.8.5
  CCCC_COMMIT: af2abb8f5

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # scripts/self-gate.sh needs the merge base with the target branch.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Restore cccc build
        id: cccc-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cccc-bin
          key: cccc-${{ runner.os }}-${{ env.CCCC_TAG }}-${{ env.CCCC_COMMIT }}

      - name: Build cccc ${{ env.CCCC_TAG }}
        if: steps.cccc-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$CCCC_TAG" https://github.com/moznion/cccc "$RUNNER_TEMP/cccc"
          actual="$(git -C "$RUNNER_TEMP/cccc" rev-parse HEAD)"
          case "$actual" in
            "$CCCC_COMMIT"*) ;;
            *) echo "::error::tag $CCCC_TAG resolved to $actual, expected $CCCC_COMMIT"; exit 1 ;;
          esac
          (cd "$RUNNER_TEMP/cccc" && CARGO_NET_GIT_FETCH_WITH_CLI=true cargo build --release --locked -p cccc-cli)
          mkdir -p .cccc-bin
          cp "$RUNNER_TEMP/cccc/target/release/cccc" .cccc-bin/cccc

      - name: Record measurer fingerprint
        run: |
          echo "NYORORI_CCCC=$PWD/.cccc-bin/cccc" >> "$GITHUB_ENV"
          .cccc-bin/cccc --version
          sha256sum .cccc-bin/cccc

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Spec 6.1: the calculation-rule fixtures must not drift for the pinned measurer.
      - run: node dist/cli.js fixtures --cccc "$NYORORI_CCCC"

      # The gate judges its own pull requests (policy/self.policy.json, read from the base side).
      # continue-on-error keeps this advisory until the open scaffold PR has landed; flip it to
      # false afterwards so OVER_LIMIT_NEW and LEGACY_WORSENED block like they do for adopters.
      - name: Self gate
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" || true
          scripts/self-gate.sh "origin/${{ github.base_ref }}"

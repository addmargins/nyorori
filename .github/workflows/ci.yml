name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check that dist/ is built from the sources
        run: |
          npm run build
          git add --all dist
          git diff --cached --exit-code -- dist || { echo '::error::dist/ is out of date. Run `npm run build` and commit dist/.'; exit 1; }
      - run: npm run typecheck
      - run: npm test

  e2e-vitest-4:
    # The e2e fixtures against Vitest 4 (the normal run uses our Vitest 5): the
    # oldest 4.0, with a Vite 7 of its day (newer ones break it), and the latest 4.x.
    name: e2e (${{ matrix.packages }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        packages: ['vitest@4.0.0 vite@7.1.11', 'vitest@4']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.packages }} for the fixtures
        run: npm install --prefix "$RUNNER_TEMP/vitest" --no-audit --no-fund --legacy-peer-deps ${{ matrix.packages }} happy-dom@20.9.0
      - run: npx vitest run test/e2e.test.ts
        env:
          NYORORI_E2E_VITEST: ${{ runner.temp }}/vitest

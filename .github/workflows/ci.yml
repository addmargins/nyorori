name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check that dist/ is built from the sources
        run: |
          npm run build
          git add --all dist
          git diff --cached --exit-code -- dist || { echo '::error::dist/ is out of date. Run `npm run build` and commit dist/.'; exit 1; }
      - run: npm run typecheck
      - run: npm test

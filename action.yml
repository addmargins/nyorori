name: nyorori
description: Fail a pull request when its Vitest tests do not notice mutations of the code it changed
branding:
  icon: check-circle
  color: orange

inputs:
  base:
    description: Git ref or SHA to diff against. Defaults to the pull request's base commit.
    default: ${{ github.event.pull_request.base.sha }}
  working-directory:
    description: Root of the Vitest project.
    default: .
  exclude:
    description: Globs of source files to leave out, relative to the working directory, one per line.
    default: ''
  max-mutants:
    description: Stop with an error instead of running more mutants than this.
    default: ''
  timeout:
    description: Extra milliseconds a mutant run may take beyond twice the baseline before it counts as a timeout.
    default: '10000'
  types:
    description: Set to 'false' to start no TypeScript, telling string `+` from numeric `+` by syntax only and listing no `?.` or `??` as unnecessary by types.
    default: 'true'
  predict:
    description: Set to 'false' to run mutants that the baseline profile predicts to survive, instead of reporting them without running.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install nyorori
      shell: bash
      # dist/ is committed, so only the runtime dependencies are installed and nothing is built.
      # None of them has an install script: the native parts come as prebuilt platform packages.
      run: npm ci --omit=dev --ignore-scripts --prefix "$GITHUB_ACTION_PATH" --no-audit --no-fund --loglevel=error
    - name: Run nyorori
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NYORORI_BASE: ${{ inputs.base }}
        NYORORI_EXCLUDE: ${{ inputs.exclude }}
        NYORORI_MAX_MUTANTS: ${{ inputs.max-mutants }}
        NYORORI_TIMEOUT: ${{ inputs.timeout }}
        NYORORI_TYPES: ${{ inputs.types }}
        NYORORI_PREDICT: ${{ inputs.predict }}
      run: |
        args=(run --base "$NYORORI_BASE" --timeout "$NYORORI_TIMEOUT")
        while IFS= read -r glob; do
          if [ -n "$glob" ]; then args+=(--exclude "$glob"); fi
        done <<< "$NYORORI_EXCLUDE"
        if [ -n "$NYORORI_MAX_MUTANTS" ]; then args+=(--max-mutants "$NYORORI_MAX_MUTANTS"); fi
        if [ "$NYORORI_TYPES" = 'false' ]; then args+=(--no-types); fi
        if [ "$NYORORI_PREDICT" = 'false' ]; then args+=(--no-predict); fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}"
